<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/image.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light only" />
    <title>SA Portfolio</title>

    <style>
      .goog-te-banner-frame {
        display: none !important;
      }
      iframe.goog-te-banner-frame {
        display: none !important;
      }
      .goog-logo-link {
        display: none !important;
      }
      .goog-te-gadget {
        display: none !important;
      }
      body {
        top: 0px !important;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <div id="google_translate_element" style="display:none;"></div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: "en",
            includedLanguages:
              "en,hi,te,ta,bn,ml,kn,gu,mr,fr,de,es,zh,ja",
            autoDisplay: false,
          },
          "google_translate_element"
        );
      }
    </script>

    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <!-- Force hide Google banner -->
    <script>
      function hideGoogleBar() {
        const iframe = document.querySelector("iframe.goog-te-banner-frame");
        if (iframe) iframe.style.display = "none";

        const banners = document.querySelectorAll(".goog-te-banner-frame, .goog-te-banner");
        banners.forEach(b => b.style.display = "none");

        document.body.style.top = "0px";
      }

      setInterval(hideGoogleBar, 500);
      window.addEventListener("load", hideGoogleBar);
    </script>

  </body>
</html>
